# Deploy static Next.js export to GitHub Pages from ./out
#
# Required once in the repo:
# Settings → Pages → Build and deployment → Source: GitHub Actions
#
# If Source is "Deploy from a branch", GitHub will publish the repo root (README)
# via the automatic "pages-build-deployment" workflow and this Action deploy will fail.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        # Custom domain https://coach-kytyzova.ru/ is served from the domain root.
        # Leave NEXT_PUBLIC_BASE_PATH unset so assets and links are not prefixed.

      - name: Publish custom-domain CNAME
        run: |
          set -euo pipefail
          printf 'coach-kytyzova.ru\n' > out/CNAME
          if grep -R -n -F --exclude=CNAME "/kutuzova-tech/" out; then
            echo "::error::static export still contains /kutuzova-tech/ paths"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
