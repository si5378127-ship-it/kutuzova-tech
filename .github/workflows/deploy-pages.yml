# Deploy static Next.js export to GitHub Pages from ./out
#
# Required once in the repo:
# Settings → Pages → Build and deployment → Source: GitHub Actions
#
# If Source is "Deploy from a branch", GitHub will publish the repo root (README)
# via the automatic "pages-build-deployment" workflow and this Action deploy will fail.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Required for https://USER.github.io/kutuzova-tech/
          # Remove / set empty after custom domain is connected
          NEXT_PUBLIC_BASE_PATH: /kutuzova-tech

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
