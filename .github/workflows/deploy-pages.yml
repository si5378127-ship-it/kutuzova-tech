# Deploy static Next.js export to GitHub Pages from ./out
#
# Required once in the repo:
# Settings → Pages → Build and deployment → Source: GitHub Actions
#
# If Source is "Deploy from a branch", GitHub will publish the repo root (README)
# via the automatic "pages-build-deployment" workflow and this Action deploy will fail.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Required for https://USER.github.io/kutuzova-tech/
          # Keep set while the site is served without a custom domain
          NEXT_PUBLIC_BASE_PATH: /kutuzova-tech

      # GitHub Pages 301-redirects username.github.io/repo → custom domain
      # whenever a CNAME file is published or Settings → Pages → Custom domain
      # is set. The site must stay on github.io until the domain is restored.
      - name: Strip custom-domain CNAME from static export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f public/CNAME out/CNAME
          if [ -e out/CNAME ] || [ -e public/CNAME ]; then
            echo "::error::CNAME must not be published while the site is served from github.io"
            exit 1
          fi
          if grep -R -n -F "coach-kytuzova.ru" out; then
            echo "::error::static export still references coach-kytuzova.ru"
            exit 1
          fi
          cname="$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' || true)"
          if [ -n "$cname" ]; then
            echo "::error::GitHub Pages custom domain is still set to '$cname'. Clear Settings → Pages → Custom domain."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
